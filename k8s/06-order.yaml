apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ecommerce
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: ecommerce-scalable-services-order:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://order_user:order_pass@postgres:5432/order_db"
            - name: INVENTORY_URL
              value: "http://inventory:8000"
            - name: PAYMENT_URL
              value: "http://payment:8000"
            - name: NOTIFICATION_URL
              value: "http://notification:8000"
            - name: PAYMENT_TIMEOUT
              value: "0.7"
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ecommerce
  labels:
    app: order
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30002
      name: http
  selector:
    app: order

